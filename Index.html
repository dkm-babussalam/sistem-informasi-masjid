<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIM Masjid</title>
    <script src="https://script.google.com/macros/s/AKfycbzUlh_4vxDsaewOsmQ_0AQQnSy9YmpzH4RUdRcvEbjSQ66yyximgeEu48aVurUzEQYN/exec"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0d382c;
        }
        
        /* Shape hiasan melingkar di sudut */
        .bg-circle-tr {
            position: absolute;
            top: -150px;
            right: -150px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.03);
            pointer-events: none;
        }

        .bg-circle-bl {
            position: absolute;
            bottom: -150px;
            left: -150px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.03);
            pointer-events: none;
        }

        /* Warna khusus */
        .bg-brand-dark {
            background-color: #0d382c;
        }

        .bg-brand-icon {
            background-color: #124536;
        }

        .bg-brand-button {
            background-color: #2e7a5c;
        }

        .bg-brand-button:hover {
            background-color: #24634a;
        }

        .text-brand-title {
            color: #0d382c;
        }

        .text-gold {
            color: #f3b233;
        }
    </style>
</head>
<body class="bg-brand-dark min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="bg-circle-tr"></div>
    <div class="bg-circle-bl"></div>

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-[420px] p-8 md:p-10 z-10 my-auto">
        
        <!-- Header Section: Icon & Titles -->
        <div class="flex flex-col items-center text-center mb-8">
            <!-- Icon Box -->
            <div class="bg-brand-icon w-16 h-16 rounded-2xl flex items-center justify-center mb-4 shadow-sm">
                <!-- SVG Icon Masjid / Dome -->
                <svg class="w-10 h-10 text-gold" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12,2A3,3 0 0,0 9,5C9,6.08 9.58,7.03 10.44,7.56C8.84,8.16 7.64,9.5 7.21,11.21C6.26,10.45 5.06,10 3.75,10A6.25,6.25 0 0,0 3,10.05V21H21V10.05A6.25,6.25 0 0,0 20.25,10C18.94,10 17.74,10.45 16.79,11.21C16.36,9.5 15.16,8.16 13.56,7.56C14.42,7.03 15,6.08 15,5A3,3 0 0,0 12,2M12,4A1,1 0 0,1 13,5A1,1 0 0,1 12,6A1,1 0 0,1 11,5A1,1 0 0,1 12,4M12,9A3,3 0 0,1 15,12V21H9V12A3,3 0 0,1 12,9M12,11A1,1 0 0,0 11,12V19H13V12A1,1 0 0,0 12,11Z" />
                </svg>
            </div>

            <!-- Title & Subtitle -->
            <h1 class="text-2xl font-bold text-brand-title tracking-tight mb-1">SIM Masjid</h1>
            <p class="text-gray-500 text-sm font-normal">Sistem Informasi Manajemen Masjid</p>
        </div>

        <form onsubmit="event.preventDefault();" class="space-y-5">
            <!-- Field: Nama Pengguna -->
            <div class="space-y-1.5">
                <label for="username" class="block text-sm font-medium text-gray-700">
                    Nama pengguna
                </label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="Masukkan nama pengguna" 
                    class="w-full px-4 py-3 rounded-lg border border-gray-200 text-gray-800 placeholder-gray-400 focus:outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition duration-150 text-sm"
                    required
                >
            </div>

            <!-- Field: Kata Sandi -->
            <div class="space-y-1.5">
                <label for="password" class="block text-sm font-medium text-gray-700">
                    Kata sandi
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Masukkan kata sandi" 
                    class="w-full px-4 py-3 rounded-lg border border-gray-200 text-gray-800 placeholder-gray-400 focus:outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition duration-150 text-sm"
                    required
                >
            </div>

            <div class="pt-2">
                <button 
                    type="submit" 
                    class="w-full bg-brand-button text-white font-medium py-3 px-4 rounded-xl shadow focus:outline-none transition duration-200 flex items-center justify-center space-x-2 text-sm"
                >
                    <i class="fa-solid fa-right-to-bracket text-base"></i>
                    <span>Masuk</span>
                </button>
            </div>
        </form>

    </div>

</body>
</html>
